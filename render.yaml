# Render Blueprint: https://docs.render.com/infrastructure-as-code
# Deploy both services from this file, or create them manually in the dashboard.
#
# FREE TIER NOTE: Data is ephemeral (lost on restart/redeploy). The seed script
# recreates 10,000 employees on each start, so this works for demos. For persistent
# data, upgrade to Starter ($7/mo) and uncomment the disk section below.

services:
  # Backend: Spring Boot API with SQLite
  - type: web
    name: salary-api
    runtime: docker
    dockerfilePath: backend/Dockerfile
    dockerContext: backend
    region: oregon
    plan: free
    healthCheckPath: /api/auth/me
    envVars:
      - key: APP_PASSWORD
        generateValue: true
      - key: CORS_ALLOWED_ORIGINS
        sync: false  # Set after frontend deploys: https://<frontend-name>.onrender.com
    # Uncomment for persistent data (requires Starter plan, $7/mo):
    # disk:
    #   name: salary-data
    #   mountPath: /data
    #   sizeGB: 1

  # Frontend: React static site
  - type: web
    name: salary-ui
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: frontend/dist
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        sync: false  # Set to backend URL: https://salary-api.onrender.com
