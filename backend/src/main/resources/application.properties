spring.application.name=salary-management

# SQLite database file; override with DB_URL in deployed environments
spring.datasource.url=${DB_URL:jdbc:sqlite:salary.db}
spring.datasource.driver-class-name=org.sqlite.JDBC
# SQLite allows a single writer, so one pooled connection avoids lock errors
spring.datasource.hikari.maximum-pool-size=1

# Schema is owned by Flyway migrations; Hibernate only validates it
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
